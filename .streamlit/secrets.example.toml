# Copy these values into Streamlit Community Cloud -> App settings -> Secrets.
# For local testing, copy this file to .streamlit/secrets.toml and fill it in.
# NEVER commit .streamlit/secrets.toml to GitHub.

[app]
password = "CHANGE-THIS-TO-YOUR-DASHBOARD-PASSWORD"

[staff]
person_1_name = "Person 1"
person_1_sheet_id = "PASTE_PERSON_1_GOOGLE_SHEET_ID_HERE"
person_2_name = "Person 2"
person_2_sheet_id = "PASTE_PERSON_2_GOOGLE_SHEET_ID_HERE"

# Add more staff in the same pattern if needed:
# person_3_name = "Staff Name"
# person_3_sheet_id = "GOOGLE_SHEET_ID"

[google_service_account]
type = "service_account"
project_id = "YOUR_GOOGLE_CLOUD_PROJECT_ID"
private_key_id = "YOUR_PRIVATE_KEY_ID"
private_key = """-----BEGIN PRIVATE KEY-----
PASTE_THE_PRIVATE_KEY_FROM_YOUR_SERVICE_ACCOUNT_JSON_HERE
-----END PRIVATE KEY-----
"""
client_email = "YOUR-SERVICE-ACCOUNT@YOUR-PROJECT.iam.gserviceaccount.com"
client_id = "YOUR_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "YOUR_CLIENT_X509_CERT_URL"
universe_domain = "googleapis.com"
